# Every push and every pull request runs the same checks a developer runs
# locally: lint, unit tests, type check, production build, and the browser
# tests against that build, with the accessibility audit among them.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # The browser tests drive an installed browser. The runner has Chrome.
      PW_CHANNEL: chrome
      # Canonical addresses in the build under test. Any origin does: the tests read them back.
      SITE_URL: https://portfolio.test
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chrome

      - name: Browser tests and accessibility audit
        run: npm run test:e2e

      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
